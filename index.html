<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        
        /* 自定义动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div class="flex h-full">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col lg:translate-x-0 lg:relative lg:z-auto -translate-x-full fixed z-50 h-full transition-transform duration-300" id="侧边栏">
            <div class="p-4 border-b border-gray-700">
                <button class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-medium flex items-center justify-center gap-2 transition-all duration-200 shadow-lg shadow-indigo-900/20" id="新建对话">
                    <span class="text-xl">✦</span>
                    <span>新建对话</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto sidebar-scroll p-2" id="对话列表">
            </div>
            <div class="p-4 border-t border-gray-700">
                <button class="w-full py-2.5 px-4 bg-transparent text-gray-400 border border-gray-600 hover:bg-red-600 hover:text-white hover:border-red-600 rounded-lg text-sm font-medium transition-all duration-200" id="清空对话">
                    清空所有记录
                </button>
            </div>
        </aside>

        <!-- 遮罩层（移动端） -->
        <div class="fixed inset-0 bg-black/50 z-40 lg:hidden hidden" id="遮罩层"></div>

        <!-- 主对话区域 -->
        <main class="flex-1 flex flex-col bg-white min-w-0">
            <!-- 顶部栏 -->
            <div class="px-6 py-4 border-b border-gray-200 bg-white flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button class="lg:hidden p-2 hover:bg-gray-100 rounded-lg" id="侧边栏开关">
                        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h2 class="text-lg font-semibold text-gray-800" id="对话标题">新对话</h2>
                </div>
                <div class="flex items-center gap-2">
                    <span class="px-3 py-1.5 bg-gradient-to-r from-indigo-500 to-purple-500 text-white text-xs font-medium rounded-full shadow-md" id="当前模型显示">
                        DeepSeek V4 Flash
                    </span>
                    <button class="p-2 hover:bg-gray-100 rounded-lg transition-colors" id="设置按钮" title="设置">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="flex-1 overflow-y-auto bg-gradient-to-b from-white to-gray-50" id="消息列表">
                <div class="flex flex-col items-center justify-center h-full px-6">
                    <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl flex items-center justify-center mb-6 shadow-xl shadow-indigo-500/30">
                        <span class="text-4xl">✦</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800 mb-2">你好，我是 AI 助手</h3>
                    <p class="text-gray-500 text-center max-w-md">有什么可以帮助你的吗？开始对话吧！</p>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="px-6 pb-6 pt-4 bg-white border-t border-gray-200">
                <div class="max-w-3xl mx-auto">
                    <div class="flex gap-2 mb-2">
                        <button class="flex-1 py-2 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition-all border-2 border-transparent" id="对话模式" data-mode="chat">
                            💬 对话模式
                        </button>
                        <button class="flex-1 py-2 px-4 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white rounded-lg text-sm font-medium transition-all border-2 border-transparent shadow-lg shadow-green-500/20" id="搜索模式" data-mode="search">
                            🔍 网络搜索
                        </button>
                    </div>
                    <div class="bg-white border border-gray-200 rounded-2xl shadow-lg shadow-gray-200/50 p-3.5 flex gap-3 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all duration-200" id="输入容器">
                        <textarea 
                            id="输入框" 
                            placeholder="输入你的问题..." 
                            rows="1"
                            class="flex-1 resize-none border-0 focus:ring-0 text-gray-800 placeholder-gray-400 text-base leading-relaxed max-h-36"
                        ></textarea>
                        <button class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-4 py-2.5 rounded-xl font-medium flex items-center justify-center min-w-[44px] shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 hover:-translate-y-0.5 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none" id="发送按钮">
                            <span class="text-lg">➤</span>
                        </button>
                    </div>
                    <p class="text-center text-xs text-gray-400 mt-3">按 Enter 发送，Shift + Enter 换行</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 设置弹窗 -->
    <div class="fixed inset-0 bg-black/50 z-[60] hidden items-center justify-center" id="设置弹窗">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 animate-fadeIn">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800">设置</h3>
                <button class="p-2 hover:bg-gray-100 rounded-lg transition-colors" id="关闭设置">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="p-6 space-y-5">
                <!-- API Key -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">API Key</label>
                    <input type="password" id="apiKey输入" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all" placeholder="输入你的 API Key">
                </div>
                <!-- Base URL -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Base URL</label>
                    <input type="text" id="baseUrl输入" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all" placeholder="https://api.deepseek.com">
                </div>
                <!-- 模型选择 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">模型</label>
                    <select id="模型选择" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all bg-white">
                        <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                        <option value="deepseek-v4">deepseek-v4</option>
                        <option value="deepseek-chat">deepseek-chat</option>
                        <option value="deepseek-reasoner">deepseek-reasoner</option>
                    </select>
                </div>
                <!-- 系统提示词 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">系统提示词</label>
                    <textarea id="系统提示词输入" rows="3" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all resize-none" placeholder="自定义AI的角色和行为，例如：你是一个专业的编程助手。"></textarea>
                </div>
            </div>
            <div class="flex gap-3 px-6 py-4 border-t border-gray-200">
                <button class="flex-1 py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-medium transition-colors" id="重置设置">
                    重置
                </button>
                <button class="flex-1 py-2.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl font-medium shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 transition-all" id="保存设置">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
